server:
  port: 9093

spring:
  application:
    name: notification-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

pulsaride:
  streams:
    request-proposed: requests:proposed
    consumer-group: notification-gateway-group

  dispatch-core:
    base-url: ${DISPATCH_CORE_BASE_URL:http://localhost:9092}

server:
  port: 9092

spring:
  application:
    name: dispatch-core
  data:
    redis:
      host: localhost
      port: 6379

pulsaride:
  streams:
    request-urgency-score: requests:urgency_score
    request-extracted: requests:extracted
    request-proposed: requests:proposed
    consumer-group: dispatch-core-group

  matching:
    top-k: 3
    poll-interval-ms: 1000

  embedding:
    provider: sentence-bert
    base-url: http://localhost:8090

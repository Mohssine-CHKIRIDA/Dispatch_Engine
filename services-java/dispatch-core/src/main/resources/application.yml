server:
  port: 9092

spring:
  application:
    name: dispatch-core
  data:
    redis:
      host: localhost
      port: 6379

pulsaride:
  streams:
    request-urgency-score: requests:urgency_scored
    request-proposed: requests:proposed
    consumer-group: dispatch-core-group

  matching:
    top-k: 3
    poll-interval-ms: 1000

  embedding:
    # "hash": deterministic local pseudo-embedding, no external API needed
    # "sentence-bert": calls the dedicated embedding-service (Sentence-BERT,
    #                  paraphrase-multilingual-mpnet-base-v2, 768 dims) -
    #                  this is what the v2 architecture doc specifies for IA 3
    # "http": calls a generic OpenAI-compatible /embeddings endpoint instead
    provider: sentence-bert
    base-url: http://localhost:8090
    api-key: ${NVIDIA_API_KEY:}
    model: nvidia/nv-embedqa-e5-v5

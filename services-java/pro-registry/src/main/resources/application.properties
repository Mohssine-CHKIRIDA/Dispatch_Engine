# Adjust datasource credentials/port to match your actual pro_registry_db
# setup - same password gotcha we hit with IA3's matching_db earlier.

server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5433/pro_registry_db
spring.datasource.username=pulsaride
spring.datasource.password=pulsaride
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

pulsaride.streams.pro-profile-updated=pro:profile_updated
pulsaride.streams.pro-availability-changed=pro:availability_changed

spring.data.redis.host=localhost
spring.data.redis.port=6379
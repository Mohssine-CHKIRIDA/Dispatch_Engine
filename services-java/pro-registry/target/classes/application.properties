# Add these to Pro Registry's application.properties (adjust datasource
# credentials/port to match your actual pro_registry_db setup, same as
# Ingestion/other Java services)

spring.datasource.url=jdbc:postgresql://localhost:5433/pro_registry_db
spring.datasource.username=postgres
spring.datasource.password=YOUR_REAL_PASSWORD

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

pulsaride.streams.pro-profile-updated=pro:profile_updated
pulsaride.streams.pro-availability-changed=pro:availability_changed

spring.data.redis.host=localhost
spring.data.redis.port=6379
